name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/server/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - name: Install backend test dependencies
        working-directory: app/server
        run: python -m pip install -e ".[test]"

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: app/client
        run: npm run build

      - name: Install Playwright browser
        working-directory: app/server
        run: python -m playwright install chromium

      - name: Run model-config regression slice
        shell: pwsh
        run: |
          $env:APP_TEST_FRONTEND_URL = "http://127.0.0.1:9847"
          $env:APP_TEST_BACKEND_URL = "http://127.0.0.1:7690"
          $backend = Start-Process -FilePath "python" -ArgumentList "-m","uvicorn","app:app","--host","127.0.0.1","--port","7690" -WorkingDirectory "app/server" -RedirectStandardOutput "app/server/.ci-modelconfig-backend.out.log" -RedirectStandardError "app/server/.ci-modelconfig-backend.err.log" -WindowStyle Hidden -PassThru
          $frontend = Start-Process -FilePath "npm.cmd" -ArgumentList "run","start" -WorkingDirectory "app/client" -RedirectStandardOutput "app/client/.ci-modelconfig-frontend.out.log" -RedirectStandardError "app/client/.ci-modelconfig-frontend.err.log" -WindowStyle Hidden -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(3)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $backendHealth = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7690/api/health" -TimeoutSec 3
                $frontendHealth = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:9847/" -TimeoutSec 3
                if ($backendHealth.StatusCode -eq 200 -and $frontendHealth.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              throw "Backend/frontend readiness check timed out."
            }

            python -m pytest app/tests/unit/test_model_config_persistence.py -q --junitxml app/tests/.ci-modelconfig-unit-junit.xml
            if ($LASTEXITCODE -ne 0) {
              throw "Model-config unit test failed with exit code $LASTEXITCODE."
            }

            python -m pytest app/tests/e2e/test_model_config_api.py app/tests/e2e/test_app_flow.py -k "runtime_toggle_enables_save_and_submits_put or model_config or dili_run_burst_click_submits_single_job or dili_run_conflict_surfaces_clear_error_message" -q --junitxml app/tests/.ci-modelconfig-e2e-junit.xml
            if ($LASTEXITCODE -ne 0) {
              throw "Model-config e2e slice failed with exit code $LASTEXITCODE."
            }
          } finally {
            foreach ($process in @($backend, $frontend)) {
              if ($null -ne $process -and -not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-artifacts
          if-no-files-found: ignore
          path: |
            app/server/.ci-modelconfig-backend.out.log
            app/server/.ci-modelconfig-backend.err.log
            app/client/.ci-modelconfig-frontend.out.log
            app/client/.ci-modelconfig-frontend.err.log
            app/tests/.ci-modelconfig-unit-junit.xml
            app/tests/.ci-modelconfig-e2e-junit.xml
