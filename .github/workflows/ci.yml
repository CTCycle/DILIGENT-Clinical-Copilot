name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_provider_e2e:
        description: 'Run the live OpenCode Go provider E2E gate with synthetic data'
        required: true
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/runtimes/cache/cargo/target
  COVERAGE_FILE: ${{ github.workspace }}/runtimes/cache/coverage/.coverage
  HF_ASSETS_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/assets
  HF_HOME: ${{ github.workspace }}/runtimes/cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/hub
  HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/hub
  MYPY_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/mypy
  NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python
  PYTEST_ADDOPTS: "--basetemp=${{ github.workspace }}/runtimes/cache/pytest/basetemp -o cache_dir=${{ github.workspace }}/runtimes/cache/pytest"
  RUFF_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/ruff
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile backend and tests
        working-directory: app/server
        run: python -m compileall -q . ../tests

      - name: Validate Alembic migrations and metadata drift
        working-directory: app/server
        env:
          EMBEDDED_DATABASE: "true"
          DILIGENT_SQLITE_PATH: ${{ github.workspace }}/runtimes/cache/pytest/ci/alembic-check.sqlite3
        run: |
          mkdir -p "$(dirname "$DILIGENT_SQLITE_PATH")"
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current --check-heads
          python -m alembic -c alembic.ini check

      - name: Run Ruff
        working-directory: app/server
        run: python -m ruff check . ../tests

      - name: Run Pyright
        working-directory: app/server
        run: python -m pyright .

      - name: Run backend unit tests
        working-directory: app/server
        run: python -m pytest ../tests/unit -q

  persistence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diligent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d diligent_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"

      - name: Run persistence contract against SQLite and PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/diligent_test
        working-directory: app/server
        run: python -m pytest ../tests/persistence -q

  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          "${env:GITHUB_WORKSPACE}\app\server\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend tests
        working-directory: app/client
        run: npm run test -- --no-watch

      - name: Build frontend
        working-directory: app/client
        run: npm run build

      - name: Install Playwright browser
        working-directory: app/server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright
        run: python -m playwright install chromium

      - name: Run full browser E2E suite
        shell: pwsh
        run: .\app\tests\ci\run_browser_e2e.ps1 -Suite Full

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-artifacts-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            runtimes/cache/pytest/browser-e2e-logs/**
            runtimes/cache/pytest/ci/**

  live-provider-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_provider_e2e == true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DATABASE_BACKEND: sqlite
      EMBEDDED_DATABASE: 'true'
      APP_TEST_BACKEND_URL: http://127.0.0.1:7690
      APP_TEST_FRONTEND_URL: http://127.0.0.1:9847
      FASTAPI_HOST: 127.0.0.1
      FASTAPI_PORT: '7690'
      UI_HOST: 127.0.0.1
      UI_PORT: '9847'
      DILIGENT_LIVE_PROVIDER_E2E: '1'
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          "${env:GITHUB_WORKSPACE}\app\server\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        working-directory: app/client
        run: npm run build -- --progress=false

      - name: Install Playwright browser
        working-directory: app/server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run live provider browser E2E
        shell: pwsh
        env:
          DATABASE_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\live-provider.sqlite3
          DILIGENT_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\live-provider.sqlite3
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\app\tests\ci\run_browser_e2e.ps1 -Suite LiveProvider

      - name: Upload provider E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-e2e-logs-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: runtimes/cache/pytest/browser-e2e-logs/**

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Export locked Python dependencies
        working-directory: app/server
        run: uv export --locked --all-extras --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/diligent-requirements.txt"

      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --strict --requirement "$RUNNER_TEMP/diligent-requirements.txt"

      - name: Audit Angular dependencies
        working-directory: app/client
        run: npm audit --audit-level=high --package-lock-only

      - name: Audit desktop dependencies
        working-directory: app/desktop
        run: npm audit --audit-level=high --package-lock-only

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-26
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        # Audit the shipped Windows graph; glib is Linux-only in this lock and
        # is intentionally excluded from the target-specific unsoundness gate.
        run: cargo audit --file app/desktop/src-tauri/Cargo.lock --target-os windows --target-arch x86_64 --deny unsound --ignore RUSTSEC-2024-0429
