name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/runtimes/cache/cargo
  PYTEST_ADDOPTS: "--basetemp=${{ github.workspace }}/app/tests/cache/pytest/basetemp -o cache_dir=${{ github.workspace }}/app/tests/cache/pytest"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.2"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile backend and tests
        working-directory: app/server
        run: python -m compileall -q . ../tests

      - name: Validate Alembic migrations and metadata drift
        working-directory: app/server
        env:
          EMBEDDED_DATABASE: "true"
          DILIGENT_SQLITE_PATH: ${{ runner.temp }}/diligent-alembic-check.sqlite3
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current --check-heads
          python -m alembic -c alembic.ini check

      - name: Run Ruff
        working-directory: app/server
        run: python -m ruff check . ../tests

      - name: Run Pyright
        working-directory: app/server
        run: python -m pyright .

      - name: Run backend unit tests
        working-directory: app/server
        run: python -m pytest ../tests/unit -q

  persistence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diligent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d diligent_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.2"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"

      - name: Run persistence contract against SQLite and PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/diligent_test
        working-directory: app/server
        run: python -m pytest ../tests/persistence -q

  windows-regression:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.2"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          "${env:GITHUB_WORKSPACE}\app\server\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend tests
        working-directory: app/client
        run: npm run test -- --no-watch

      - name: Build frontend
        working-directory: app/client
        run: npm run build

      - name: Install Playwright browser
        working-directory: app/server
        run: python -m playwright install chromium

      - name: Run model-config regression slice
        shell: pwsh
        run: |
          $env:APP_TEST_FRONTEND_URL = "http://127.0.0.1:9847"
          $env:APP_TEST_BACKEND_URL = "http://127.0.0.1:7690"
          $ciArtifactDir = Join-Path $env:GITHUB_WORKSPACE "app/tests/cache/ci/modelconfig"
          $pytestArtifactDir = Join-Path $env:GITHUB_WORKSPACE "app/tests/cache/pytest/ci"
          New-Item -ItemType Directory -Path $ciArtifactDir, $pytestArtifactDir -Force | Out-Null
          $ciRuntimeDir = Join-Path $env:RUNNER_TEMP "diligent-modelconfig"
          New-Item -ItemType Directory -Path $ciRuntimeDir -Force | Out-Null
          $env:DATABASE_BACKEND = "sqlite"
          $env:DATABASE_SQLITE_PATH = Join-Path $ciRuntimeDir "modelconfig.sqlite3"
          $env:DILIGENT_SQLITE_PATH = $env:DATABASE_SQLITE_PATH
          $backendOut = Join-Path $ciArtifactDir "backend.out.log"
          $backendErr = Join-Path $ciArtifactDir "backend.err.log"
          $frontendOut = Join-Path $ciArtifactDir "frontend.out.log"
          $frontendErr = Join-Path $ciArtifactDir "frontend.err.log"
          function Write-ProcessDiagnostics($label, $process, $stdoutPath, $stderrPath) {
            Write-Output "[$label] process diagnostics"
            if ($null -eq $process) {
              Write-Output "Process was not created."
            } else {
              $process.Refresh()
              Write-Output "PID=$($process.Id) HasExited=$($process.HasExited)"
              if ($process.HasExited) {
                Write-Output "ExitCode=$($process.ExitCode)"
              }
            }
            foreach ($log in @(@("stdout", $stdoutPath), @("stderr", $stderrPath))) {
              Write-Output "--- $($label) $($log[0]) ---"
              if (Test-Path -LiteralPath $log[1]) {
                Get-Content -LiteralPath $log[1] -Tail 200
              } else {
                Write-Output "Log file not created: $($log[1])"
              }
            }
          }
          $backend = Start-Process -FilePath "python" -ArgumentList "-m","uvicorn","app:app","--host","127.0.0.1","--port","7690" -WorkingDirectory "app/server" -RedirectStandardOutput $backendOut -RedirectStandardError $backendErr -WindowStyle Hidden -PassThru
          try {
            $backendReady = $false
            $backendDeadline = (Get-Date).AddMinutes(3)
            $lastBackendError = "No response received."
            while ((Get-Date) -lt $backendDeadline) {
              try {
                $backendHealth = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7690/api/health" -TimeoutSec 3
                $backendConfig = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7690/api/model-config" -TimeoutSec 3
                if ($backendHealth.StatusCode -eq 200 -and $backendConfig.StatusCode -eq 200) {
                  $backendReady = $true
                  break
                }
              } catch {
                $lastBackendError = $_.Exception.Message
                $backend.Refresh()
                if ($backend.HasExited) {
                  break
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $backendReady) {
              Write-ProcessDiagnostics "backend readiness failure" $backend $backendOut $backendErr
              throw "Backend readiness check failed before deadline. Last probe error: $lastBackendError"
            }

            $frontend = Start-Process -FilePath "npm.cmd" -ArgumentList "run","preview","--","--host","127.0.0.1","--port","9847","--strictPort" -WorkingDirectory "app/client" -RedirectStandardOutput $frontendOut -RedirectStandardError $frontendErr -WindowStyle Hidden -PassThru
            $frontendReady = $false
            $frontendDeadline = (Get-Date).AddMinutes(3)
            $lastFrontendError = "No response received."
            while ((Get-Date) -lt $frontendDeadline) {
              try {
                $frontendHealth = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:9847/" -TimeoutSec 3
                if ($frontendHealth.StatusCode -lt 500) {
                  $frontendReady = $true
                  break
                }
              } catch {
                $lastFrontendError = $_.Exception.Message
                $frontend.Refresh()
                if ($frontend.HasExited) {
                  break
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $frontendReady) {
              Write-ProcessDiagnostics "frontend readiness failure" $frontend $frontendOut $frontendErr
              throw "Frontend readiness check failed before deadline. Last probe error: $lastFrontendError"
            }

            $unitJunit = Join-Path $pytestArtifactDir "modelconfig-unit-junit.xml"
            $e2eJunit = Join-Path $pytestArtifactDir "modelconfig-e2e-junit.xml"
            python -m pytest app/tests/unit/test_model_config_persistence.py -q --junitxml $unitJunit
            if ($LASTEXITCODE -ne 0) {
              throw "Model-config unit test failed with exit code $LASTEXITCODE."
            }

            python -m pytest app/tests/e2e/test_model_config_api.py app/tests/e2e/test_app_flow.py -k "runtime_toggle_enables_save_and_submits_put or model_config or dili_run_burst_click_submits_single_job or dili_run_conflict_surfaces_clear_error_message" -q --junitxml $e2eJunit
            if ($LASTEXITCODE -ne 0) {
              throw "Model-config e2e slice failed with exit code $LASTEXITCODE."
            }
          } finally {
            if (-not $backendReady -or -not $frontendReady) {
              Write-ProcessDiagnostics "regression cleanup" $backend $backendOut $backendErr
              Write-ProcessDiagnostics "regression cleanup" $frontend $frontendOut $frontendErr
            }
            foreach ($process in @($backend, $frontend)) {
              if ($null -ne $process -and -not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-artifacts-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            app/tests/cache/ci/modelconfig/**
            app/tests/cache/pytest/ci/**
