name: Apply clinical pipeline simplification v2

on:
  push:
    branches: [clinical-pipeline-simplification]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply focused changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          session_service = "app/server/services/session/session_service.py"
          replace_once(session_service, "from services.clinical.drug_blocks import isolate_drug_blocks\n", "")
          replace_once(
              session_service,
              "    has_timing_information,\n",
              "",
          )
          replace_once(
              session_service,
              '''    def prepare_structured_clinical_input(\n        self,\n        request_payload: ClinicalSessionRequest,\n    ) -> dict[str, Any]:\n        clinical_input = (request_payload.clinical_input or "").strip()\n        if not clinical_input:\n            raise ServiceValidationError("Clinical input is required.")\n\n        parse_result = self.validate_assessment_prerequisites_without_llm(\n            request_payload\n        )''',
              '''    def prepare_structured_clinical_input(\n        self,\n        request_payload: ClinicalSessionRequest,\n        *,\n        parse_result: InitialTextSectionParseResult,\n    ) -> dict[str, Any]:\n        clinical_input = (request_payload.clinical_input or "").strip()\n        if not clinical_input:\n            raise ServiceValidationError("Clinical input is required.")''',
          )
          replace_once(
              session_service,
              '''    def ensure_submission_requirements(self, payload: PatientData) -> None:\n        validation_bundle = self.build_validation_bundle_for_payload(payload)\n        ensure_required_sections(payload, bundle=validation_bundle)\n\n        cleaned_therapy_text = self.drugs_parser.clean_text(payload.drugs or "")\n        if not cleaned_therapy_text:\n            # Keep submission permissive when therapy content cannot provide timing.\n            return\n\n        lines = [\n            block.text.strip()\n            for block in isolate_drug_blocks(cleaned_therapy_text)\n            if block.text.strip()\n        ]\n        parsed_entries = [\n            parsed\n            for parsed in (self.drugs_parser.parse_line(line) for line in lines)\n            if parsed is not None\n        ]\n        if any(has_timing_information(entry) for entry in parsed_entries):\n            return\n        # Do not block session start when therapy timing is not explicitly available.\n        # Downstream stages can still assess DILI with uncertainty notes.\n        return''',
              '''    def ensure_submission_requirements(self, payload: PatientData) -> None:\n        validation_bundle = self.build_validation_bundle_for_payload(payload)\n        ensure_required_sections(payload, bundle=validation_bundle)''',
          )

          workflow = "app/server/services/session/session_workflow.py"
          replace_once(
              workflow,
              "    service.validate_assessment_prerequisites_without_llm(request_payload)",
              "    parse_result = service.validate_assessment_prerequisites_without_llm(\n        request_payload\n    )",
          )
          replace_once(
              workflow,
              "        prepared = service.prepare_structured_clinical_input(request_payload)",
              "        prepared = service.prepare_structured_clinical_input(\n            request_payload,\n            parse_result=parse_result,\n        )",
          )
          replace_once(
              "app/server/services/session/preflight.py",
              "        prepared = service.prepare_structured_clinical_input(request_payload)",
              "        prepared = service.prepare_structured_clinical_input(\n            request_payload,\n            parse_result=parse_result,\n        )",
          )

          revision_repo = "app/server/repositories/session_revision_repository.py"
          replace_once(
              revision_repo,
              '''        pipeline_run_id: str | None = None,\n        initiated_by: str | None = None,\n    ) -> dict[str, Any] | None:\n        del reviewer_note, initiated_by\n        safe_session_id = int(session_id)\n        with self.session_factory() as db_session:\n            source = db_session.execute(\n                select(ClinicalSessionVersion)\n                .where(ClinicalSessionVersion.session_id == safe_session_id)\n                .order_by(ClinicalSessionVersion.version_number.desc())\n                .limit(1)\n            ).scalar_one_or_none()''',
              '''        pipeline_run_id: str | None = None,\n        initiated_by: str | None = None,\n        source_version_id: int | None = None,\n    ) -> dict[str, Any] | None:\n        del reviewer_note, initiated_by\n        safe_session_id = int(session_id)\n        with self.session_factory() as db_session:\n            if source_version_id is None:\n                source = db_session.execute(\n                    select(ClinicalSessionVersion)\n                    .where(ClinicalSessionVersion.session_id == safe_session_id)\n                    .order_by(ClinicalSessionVersion.version_number.desc())\n                    .limit(1)\n                ).scalar_one_or_none()\n            else:\n                source = db_session.get(ClinicalSessionVersion, int(source_version_id))\n                if source is not None and int(source.session_id or 0) != safe_session_id:\n                    return None''',
          )
          replace_once(
              "app/server/services/inspection/revision_scaffold.py",
              '''            pipeline_run_id=pipeline_run_id,\n            initiated_by="revision_agent",\n        )''',
              '''            pipeline_run_id=pipeline_run_id,\n            initiated_by="revision_agent",\n            source_version_id=int(source_version["version_id"]),\n        )''',
          )

          revision_agent = "app/server/services/inspection/revision_agent.py"
          replace_once(
              revision_agent,
              '''        if not request.dry_run and not qa.blocking_issues:\n            root_session_id = int(model_configuration["root_session_id"])\n            revised_session_id = self.clinical_session_repository.save_clinical_session(''',
              '''        if not request.dry_run and not qa.blocking_issues:\n            root_session_id = int(model_configuration["root_session_id"])\n            sections = (\n                session.get("sections")\n                if isinstance(session.get("sections"), dict)\n                else {}\n            )\n            revised_session_id = self.clinical_session_repository.save_clinical_session(''',
          )
          replace_once(
              revision_agent,
              '''                    "anamnesis": (session.get("sections") or {}).get("anamnesis"),\n                    "drugs": (session.get("sections") or {}).get("therapy"),\n                    "laboratory_analysis": (session.get("sections") or {}).get(\n                        "laboratory_analysis"\n                    ),''',
              '''                    "anamnesis": sections.get("anamnesis"),\n                    "drugs": sections.get("drugs") or sections.get("therapy"),\n                    "laboratory_analysis": sections.get("laboratory_analysis"),''',
          )

          inspection_service = "app/server/services/inspection/service.py"
          replace_once(
              inspection_service,
              '''        force_regenerate: bool,\n        job_id: str,\n    ) -> dict[str, Any]:\n        timeline = self.generate_session_timeline(\n            session_id,\n            force_regenerate=force_regenerate,''',
              '''        force_regenerate: bool,\n        source: dict[str, Any],\n        job_id: str,\n    ) -> dict[str, Any]:\n        timeline = self.generate_session_timeline(\n            session_id,\n            force_regenerate=force_regenerate,\n            source=source,''',
          )
          replace_once(
              inspection_service,
              '''        safe_session_id = int(session_id)\n        if (\n            self.session_timeline_repository.get_session_timeline_source(\n                safe_session_id\n            )\n            is None\n        ):\n            raise KeyError(safe_session_id)''',
              '''        safe_session_id = int(session_id)\n        source = self.session_timeline_repository.get_session_timeline_source(\n            safe_session_id\n        )\n        if source is None:\n            raise KeyError(safe_session_id)''',
          )
          replace_once(
              inspection_service,
              '''            safe_session_id,\n            force_regenerate=force_regenerate,\n        )\n        job_id = self.jobs.start_job(''',
              '''            safe_session_id,\n            force_regenerate=force_regenerate,\n            source=source,\n        )\n        job_id = self.jobs.start_job(''',
          )

          timeline = "app/server/services/inspection/timeline.py"
          replace_once(
              timeline,
              '''        force_regenerate: bool = False,\n        progress_callback: Callable[[float, str], None] | None = None,''',
              '''        force_regenerate: bool = False,\n        source: dict[str, Any] | None = None,\n        progress_callback: Callable[[float, str], None] | None = None,''',
          )
          replace_once(
              timeline,
              '''            source = self.session_timeline_repository.get_session_timeline_source(\n                session_id\n            )\n            if source is None:\n                return None''',
              '''            if source is None:\n                source = self.session_timeline_repository.get_session_timeline_source(\n                    session_id\n                )\n                if source is None:\n                    return None''',
          )
          replace_once(
              timeline,
              '''                timeline = PatientTimeline(\n                    **{\n                        **timeline.model_dump(),\n                        "generation_status": "llm_generated",''',
              '''                timeline = timeline.model_copy(\n                    update={\n                        "generation_status": "llm_generated",''',
          )
          replace_once(timeline, '''                    }\n                )\n            except Exception as exc:''', '''                    }\n                )\n            except Exception as exc:''')
          replace_once(
              timeline,
              '''                timeline = PatientTimeline(\n                    **{\n                        **timeline.model_dump(),\n                        "source_model": source_model,''',
              '''                timeline = timeline.model_copy(\n                    update={\n                        "source_model": source_model,''',
          )
          # The closing shape is the same for model_copy, no extra replacement is required.

          replace_once(
              "app/tests/unit/test_session_service.py",
              "    prepared = service.prepare_structured_clinical_input(request)",
              '''    parse_result = service.validate_assessment_prerequisites_without_llm(request)\n    monkeypatch.setattr(\n        service,\n        "validate_assessment_prerequisites_without_llm",\n        lambda _: (_ for _ in ()).throw(\n            AssertionError("structured preparation must reuse the validated parse result")\n        ),\n    )\n    prepared = service.prepare_structured_clinical_input(\n        request,\n        parse_result=parse_result,\n    )''',
          )
          replace_once(
              "app/tests/unit/test_assessment_preflight.py",
              '''        lambda req: {\n            "normalized_document": object(),''',
              '''        lambda req, *, parse_result: {\n            "normalized_document": object(),''',
          )
          replace_once(
              "app/tests/unit/test_polling_interval_centralization.py",
              '''        lambda request_payload: {\n            "normalized_document": object(),''',
              '''        lambda request_payload, *, parse_result: {\n            "normalized_document": object(),''',
          )
          replace_once(
              "app/tests/unit/test_revision_agent_skeleton.py",
              '''    assert revised_session is not None\n    assert revised_session["report"] == draft["payload"]["revised_report_text"]''',
              '''    assert revised_session is not None\n    assert revised_session["report"] == draft["payload"]["revised_report_text"]\n    assert revised_session["sections"]["drugs"] == "Amoxicillin started 2026-01-01."''',
          )

          revision_path = Path("app/tests/unit/test_revision_agent_skeleton.py")
          revision_text = revision_path.read_text(encoding="utf-8")
          revision_test = '''\n\n###############################################################################\ndef test_revision_shell_uses_explicit_source_version(tmp_path: Path) -> None:\n    serializer = build_file_serializer(tmp_path)\n    session_id = save_revision_source_session(serializer)\n    original = serializer.session_revision_repository.get_version_record_for_session(session_id)\n    assert original is not None\n    serializer.session_revision_repository.update_current_report_text_with_manual_audit(\n        session_id,\n        report_text="Manually corrected DILI report.",\n        edited_fields=["report_text"],\n        reviewer_note="Create a newer source version.",\n        edited_by="Unit test",\n        metadata={},\n    )\n    latest = serializer.session_revision_repository.get_version_record_for_session(session_id)\n    assert latest is not None\n    assert latest["version_id"] != original["version_id"]\n    shell = serializer.session_revision_repository.create_revision_version_shell(\n        session_id,\n        reviewer_note=None,\n        configuration={},\n        pipeline_run_id="explicit-source-version",\n        source_version_id=int(original["version_id"]),\n    )\n    assert shell is not None\n    assert shell["source_version_id"] == original["version_id"]\n'''
          if "def test_revision_shell_uses_explicit_source_version" in revision_text:
              raise RuntimeError("Revision source-version regression already exists")
          revision_path.write_text(revision_text + revision_test, encoding="utf-8")

          timeline_path = Path("app/tests/unit/test_data_inspection_repository.py")
          timeline_text = timeline_path.read_text(encoding="utf-8")
          timeline_test = '''\n\n###############################################################################\ndef test_timeline_job_reuses_source_loaded_at_start(monkeypatch) -> None:\n    repository_graph, _ = build_repository_graph_for_test()\n    save_session(\n        repository_graph,\n        patient_name="Timeline Snapshot Patient",\n        timestamp=datetime(2025, 1, 1, 8, 30),\n        status="successful",\n        report="Timeline snapshot report",\n        anamnesis="Symptoms started in January 2025.",\n    )\n    rows, _ = repository_graph.clinical_session_repository.list_sessions(\n        search="Timeline Snapshot Patient", status_filter=None, date_mode=None,\n        filter_date=None, offset=0, limit=10,\n    )\n    session_id = int(rows[0]["session_id"])\n    service = build_service(\n        repository_graph, timeline_extractor=FakeTimelineExtractor(), jobs=JobManager()\n    )\n    source_reads = 0\n    original_get_source = service.session_timeline_repository.get_session_timeline_source\n    def tracked_get_source(value: int) -> dict[str, Any] | None:\n        nonlocal source_reads\n        source_reads += 1\n        return original_get_source(value)\n    monkeypatch.setattr(\n        service.session_timeline_repository, "get_session_timeline_source", tracked_get_source\n    )\n    started = service.start_session_timeline_job(session_id, force_regenerate=True)\n    job_id = str(started["job_id"])\n    for _ in range(100):\n        status = service.get_session_timeline_job_status(session_id, job_id)\n        if status and status["status"] in {"completed", "failed", "cancelled"}:\n            break\n        time.sleep(0.01)\n    else:\n        raise AssertionError("Timeline job did not finish")\n    assert status is not None\n    assert status["status"] == "completed"\n    assert source_reads == 1\n'''
          if "def test_timeline_job_reuses_source_loaded_at_start" in timeline_text:
              raise RuntimeError("Timeline source-reuse regression already exists")
          timeline_path.write_text(timeline_text + timeline_test, encoding="utf-8")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.2"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock
      - name: Install backend dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate
        working-directory: app/server
        run: |
          python -m compileall -q . ../tests
          python -m ruff check . ../tests
          python -m pyright .
          python -m pytest ../tests/unit/test_session_service.py ../tests/unit/test_assessment_preflight.py ../tests/unit/test_polling_interval_centralization.py ../tests/unit/test_revision_agent_skeleton.py ../tests/unit/test_data_inspection_repository.py -q
      - name: Commit validated code
        shell: bash
        run: |
          git rm .github/workflows/apply-clinical-pipeline-simplification.yml .github/workflows/apply-clinical-pipeline-simplification-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/server app/tests
          git commit -m "refactor: simplify clinical processing pipelines"
          git push origin HEAD:clinical-pipeline-simplification
