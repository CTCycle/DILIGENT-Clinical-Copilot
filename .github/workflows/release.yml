name: Windows Desktop Release
run-name: Desktop ${{ inputs.mode }} v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare an unsigned candidate or publish an already tested candidate
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      version:
        description: Exact major.minor.patch release version
        type: string
        default: '3.5.0'
        required: true
      candidate_run_id:
        description: Successful prepare run ID (publish only)
        type: string
      operator_evidence:
        description: Native and clean Windows 11 QA evidence reference, including tested hashes (publish only)
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/runtimes/cache/cargo/target
  COVERAGE_FILE: ${{ github.workspace }}/runtimes/cache/coverage/.coverage
  HF_ASSETS_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/assets
  HF_HOME: ${{ github.workspace }}/runtimes/cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/hub
  HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/hub
  MYPY_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/mypy
  NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python
  PYTEST_ADDOPTS: "--basetemp=${{ github.workspace }}/runtimes/cache/pytest/basetemp -o cache_dir=${{ github.workspace }}/runtimes/cache/pytest"
  RUFF_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/ruff
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv

  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require synchronized source, version, and absent tag/release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\app\desktop\build\release_candidate.ps1 -Action Source -Version $env:RELEASE_VERSION

  release-preflight:
    if: inputs.mode == 'prepare'
    needs: source
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Verify launcher release parameter contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Get-Command .\start_on_windows.ps1 -CommandType ExternalScript
          foreach ($parameter in @("Action", "Version", "DesktopTarget")) {
            if (-not $launcher.Parameters.ContainsKey($parameter)) {
              throw "Launcher is missing required release parameter: -$parameter"
            }
          }
          if ($launcher.Parameters.ContainsKey("Force")) {
            throw "Launcher exposes obsolete release parameter: -Force"
          }
          Write-Output "Launcher release parameter contract verified."

      - name: Install backend test dependencies
        working-directory: app/server
        run: uv sync --locked --all-extras

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run backend release gates
        shell: pwsh
        env:
          DILIGENT_DATA_PATH: ${{ github.workspace }}\assets\QA\release-gates\backend\preflight-data
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:GITHUB_WORKSPACE "app\server\.venv\Scripts\python.exe"
          New-Item -ItemType Directory -Path $env:DILIGENT_DATA_PATH -Force | Out-Null
          function Invoke-Checked([string]$label, [string]$executable, [string[]]$arguments) {
            & $executable @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$label failed with exit code $LASTEXITCODE"
            }
          }
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "app\server")
          try {
            Invoke-Checked "Backend compilation" $python @("-m", "compileall", "-q", ".", "../tests")
            Invoke-Checked "Alembic upgrade" $python @("-m", "alembic", "-c", "alembic.ini", "upgrade", "head")
            Invoke-Checked "Alembic head validation" $python @("-m", "alembic", "-c", "alembic.ini", "current", "--check-heads")
            Invoke-Checked "Alembic drift validation" $python @("-m", "alembic", "-c", "alembic.ini", "check")
            Invoke-Checked "Ruff" $python @("-m", "ruff", "check", ".", "../tests", "--no-cache")
            Invoke-Checked "Pyright" $python @("-m", "pyright", ".")
            Invoke-Checked "Backend tests" $python @("-m", "pytest", "../tests/unit", "../tests/persistence", "-q")
          } finally {
            Pop-Location
          }

      - name: Run frontend tests and production build
        working-directory: app/client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run test -- --no-watch
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed with exit code $LASTEXITCODE" }
          npm run build -- --progress=false
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed with exit code $LASTEXITCODE" }

      - name: Install Playwright browser
        working-directory: app/server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run canonical full browser regression
        shell: pwsh
        env:
          DILIGENT_BROWSER_E2E_CACHE_ROOT: ${{ github.workspace }}/assets/QA/release-gates/browser-cache
        run: .\app\tests\ci\run_browser_e2e.ps1 -Suite Full

      - name: Retain deterministic browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-full-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/QA/release-gates/browser-cache/pytest/browser-e2e-logs/**
          if-no-files-found: ignore
          retention-days: 14

  release-persistence-preflight:
    if: inputs.mode == 'prepare'
    needs: source
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diligent_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d diligent_release_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"

      - name: Run SQLite and PostgreSQL persistence gates
        working-directory: app/server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/diligent_release_test
        run: python -m pytest ../tests/persistence -q

  release-live-provider-e2e:
    if: inputs.mode == 'prepare'
    needs: source
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP_TEST_BACKEND_URL: http://127.0.0.1:7690
      APP_TEST_FRONTEND_URL: http://127.0.0.1:9847
      FASTAPI_HOST: 127.0.0.1
      FASTAPI_PORT: '7690'
      UI_HOST: 127.0.0.1
      UI_PORT: '9847'
      DILIGENT_LIVE_PROVIDER_E2E: '1'
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Verify provider secret is present
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENCODE_GO_API_KEY)) {
            throw 'OPENCODE_GO_API_KEY is required for the release live-provider E2E gate.'
          }

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          "${env:GITHUB_WORKSPACE}\app\server\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        working-directory: app/client
        run: npm run build -- --progress=false

      - name: Install Playwright browser
        working-directory: app/server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run release live-provider browser E2E
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
          DILIGENT_BROWSER_E2E_CACHE_ROOT: ${{ github.workspace }}/assets/QA/release-gates/provider-cache
        run: .\app\tests\ci\run_browser_e2e.ps1 -Suite LiveProvider

      - name: Retain provider E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-provider-e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: assets/QA/release-gates/provider-cache/pytest/browser-e2e-logs/**

  release-security-preflight:
    if: inputs.mode == 'prepare'
    needs: source
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Export locked Python dependencies
        working-directory: app/server
        run: uv export --locked --all-extras --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/diligent-requirements.txt"

      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --strict --requirement "$RUNNER_TEMP/diligent-requirements.txt"

      - name: Audit Angular dependencies
        working-directory: app/client
        run: npm audit --audit-level=high --package-lock-only

      - name: Audit desktop dependencies
        working-directory: app/desktop
        run: npm audit --audit-level=high --package-lock-only

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-26
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        # Audit the shipped Windows graph; glib is Linux-only in this lock and
        # is intentionally excluded from the target-specific unsoundness gate.
        run: cargo audit --file app/desktop/src-tauri/Cargo.lock --target-os windows --target-arch x86_64 --deny unsound --ignore RUSTSEC-2024-0429

  prepare:
    if: inputs.mode == 'prepare'
    needs: [source, release-preflight, release-persistence-preflight, release-live-provider-e2e, release-security-preflight]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - name: Build the explicitly unsigned candidate once
        shell: pwsh
        run: .\start_on_windows.ps1 -Action BuildDesktopRelease -Version $env:RELEASE_VERSION -DesktopTarget All
      - name: Install locked validation extras in the existing environment
        shell: pwsh
        working-directory: app/server
        env:
          PYTHONHOME: ${{ github.workspace }}/runtimes/python
        run: |
          & ../../runtimes/uv/uv.exe sync --locked --all-extras --group desktop-build
          if ($LASTEXITCODE -ne 0) { throw 'Validation dependency installation failed.' }
      - name: Validate unsigned portable, deep paths, and MSI lifecycle
        shell: pwsh
        run: |
          .\app\desktop\build\smoke_release.ps1 -Version $env:RELEASE_VERSION -DesktopTarget All -InstallMsi -RequireUnsigned -TestDeepPath -ReportDirectory "$env:GITHUB_WORKSPACE/assets/QA/release-gates/msi"
      - name: Record exact source, artifact hashes, and gate provenance
        shell: pwsh
        env:
          RELEASE_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          New-Item -ItemType Directory -Path candidate/qa -Force | Out-Null
          Copy-Item release/* -Destination candidate
          Copy-Item assets/QA/release-gates/msi/* -Destination candidate/qa
          .\app\desktop\build\release_candidate.ps1 -Action Record -Version $env:RELEASE_VERSION -ArtifactDirectory candidate
      - name: Retain the immutable unsigned candidate for operator validation and promotion
        uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/**
          if-no-files-found: error
          retention-days: 30
      - name: Retain lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/QA/release-gates/msi/**
          if-no-files-found: ignore
          retention-days: 30

  publication-preflight:
    if: inputs.mode == 'publish'
    needs: source
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.candidate.outputs.attempt }}
      candidate_url: ${{ steps.candidate.outputs.candidate_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check candidate provenance and required reviewer protection
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          OPERATOR_EVIDENCE: ${{ inputs.operator_evidence }}
        run: .\app\desktop\build\release_candidate.ps1 -Action Candidate -Version $env:RELEASE_VERSION -CandidateRunId $env:CANDIDATE_RUN_ID

  publish:
    if: inputs.mode == 'publish'
    needs: [source, publication-preflight]
    environment:
      name: desktop-release
      url: ${{ needs.publication-preflight.outputs.candidate_url }}
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      OPERATOR_EVIDENCE: ${{ inputs.operator_evidence }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the selected immutable candidate without rebuilding
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: desktop-candidate-${{ inputs.candidate_run_id }}-${{ needs.publication-preflight.outputs.attempt }}
          path: release
      - name: Verify and promote the operator-approved candidate
        shell: pwsh
        run: .\app\desktop\build\release_candidate.ps1 -Action Publish -Version $env:RELEASE_VERSION -CandidateRunId $env:CANDIDATE_RUN_ID
      - name: Retain distribution verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/QA/**
          if-no-files-found: ignore
          retention-days: 30
