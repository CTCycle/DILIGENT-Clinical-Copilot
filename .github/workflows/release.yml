name: Windows Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/runtimes/cache/cargo/target
  COVERAGE_FILE: ${{ github.workspace }}/runtimes/cache/coverage/.coverage
  HF_ASSETS_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/assets
  HF_HOME: ${{ github.workspace }}/runtimes/cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/hub
  HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/runtimes/cache/huggingface/hub
  MYPY_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/mypy
  NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
  PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/python
  PYTEST_ADDOPTS: "--basetemp=${{ github.workspace }}/runtimes/cache/pytest/basetemp -o cache_dir=${{ github.workspace }}/runtimes/cache/pytest"
  RUFF_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/ruff
  UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv

jobs:
  release-preflight:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Verify tagged SHA is synchronized with main
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin main
          $tagSha = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          $mainSha = (git rev-parse "refs/remotes/origin/main^{commit}").Trim()
          if ($tagSha -ne $mainSha) {
            throw "Release tag $($env:RELEASE_TAG) resolves to $tagSha, but origin/main is $mainSha."
          }
          Write-Output "Release tag is synchronized with origin/main: $tagSha"

      - name: Verify launcher release parameter contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Get-Command .\start_on_windows.ps1 -CommandType ExternalScript
          foreach ($parameter in @("Action", "Version", "DesktopTarget")) {
            if (-not $launcher.Parameters.ContainsKey($parameter)) {
              throw "Launcher is missing required release parameter: -$parameter"
            }
          }
          if ($launcher.Parameters.ContainsKey("Force")) {
            throw "Launcher exposes obsolete release parameter: -Force"
          }
          Write-Output "Launcher release parameter contract verified."

      - name: Install backend test dependencies
        working-directory: app/server
        run: uv sync --locked --all-extras

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run backend release gates
        shell: pwsh
        env:
          EMBEDDED_DATABASE: "true"
          DILIGENT_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\release-preflight.sqlite3
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:GITHUB_WORKSPACE "app\server\.venv\Scripts\python.exe"
          function Invoke-Checked([string]$label, [string]$executable, [string[]]$arguments) {
            & $executable @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$label failed with exit code $LASTEXITCODE"
            }
          }
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "app\server")
          try {
            Invoke-Checked "Backend compilation" $python @("-m", "compileall", "-q", ".", "../tests")
            Invoke-Checked "Alembic upgrade" $python @("-m", "alembic", "-c", "alembic.ini", "upgrade", "head")
            Invoke-Checked "Alembic head validation" $python @("-m", "alembic", "-c", "alembic.ini", "current", "--check-heads")
            Invoke-Checked "Alembic drift validation" $python @("-m", "alembic", "-c", "alembic.ini", "check")
            Invoke-Checked "Ruff" $python @("-m", "ruff", "check", ".", "../tests", "--no-cache")
            Invoke-Checked "Pyright" $python @("-m", "pyright", ".")
            Invoke-Checked "Backend tests" $python @("-m", "pytest", "../tests/unit", "../tests/persistence", "-q")
          } finally {
            Pop-Location
          }

      - name: Run frontend tests and production build
        working-directory: app/client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run test -- --no-watch
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed with exit code $LASTEXITCODE" }
          npm run build -- --progress=false
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed with exit code $LASTEXITCODE" }

      - name: Install Playwright browser
        working-directory: app/server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run full release browser E2E suite
        shell: pwsh
        env:
          DATABASE_BACKEND: sqlite
          EMBEDDED_DATABASE: "true"
          DATABASE_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\release-e2e.sqlite3
          DILIGENT_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\release-e2e.sqlite3
          APP_TEST_BACKEND_URL: http://127.0.0.1:7690
          APP_TEST_FRONTEND_URL: http://127.0.0.1:9847
          FASTAPI_HOST: 127.0.0.1
          FASTAPI_PORT: "7690"
          UI_HOST: 127.0.0.1
          UI_PORT: "9847"
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:GITHUB_WORKSPACE "app\server\.venv\Scripts\python.exe"
          $backendDir = Join-Path $env:GITHUB_WORKSPACE "app\server"
          $frontendDir = Join-Path $env:GITHUB_WORKSPACE "app\client"
          $logDir = Join-Path $env:GITHUB_WORKSPACE "runtimes/cache/pytest/release-e2e-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $backend = $null
          $frontend = $null
          $backendReady = $false
          $frontendReady = $false

          function Write-Diagnostics($label, $process, $stdoutPath, $stderrPath) {
            Write-Output "[$label]"
            if ($null -eq $process) {
              Write-Output "Process was not created."
            } else {
              $process.Refresh()
              Write-Output "PID=$($process.Id) HasExited=$($process.HasExited)"
              if ($process.HasExited) { Write-Output "ExitCode=$($process.ExitCode)" }
            }
            foreach ($log in @($stdoutPath, $stderrPath)) {
              if (Test-Path -LiteralPath $log) {
                Write-Output "--- $log ---"
                Get-Content -LiteralPath $log -Tail 200
              }
            }
          }

          $backendOut = Join-Path $logDir "backend.out.log"
          $backendErr = Join-Path $logDir "backend.err.log"
          $frontendOut = Join-Path $logDir "frontend.out.log"
          $frontendErr = Join-Path $logDir "frontend.err.log"
          $backend = Start-Process -FilePath $python -ArgumentList "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "7690" -WorkingDirectory $backendDir -RedirectStandardOutput $backendOut -RedirectStandardError $backendErr -WindowStyle Hidden -PassThru
          try {
            $backendDeadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $backendDeadline) {
              try {
                $health = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7690/api/health" -TimeoutSec 3
                $config = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7690/api/model-config" -TimeoutSec 3
                if ($health.StatusCode -eq 200 -and $config.StatusCode -eq 200) {
                  $backendReady = $true
                  break
                }
              } catch {
                $backend.Refresh()
                if ($backend.HasExited) { break }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $backendReady) {
              Write-Diagnostics "backend readiness failure" $backend $backendOut $backendErr
              throw "Backend readiness failed before the release E2E deadline."
            }

            $frontend = Start-Process -FilePath "npm.cmd" -ArgumentList "run", "preview", "--", "--host", "127.0.0.1", "--port", "9847", "--strictPort" -WorkingDirectory $frontendDir -RedirectStandardOutput $frontendOut -RedirectStandardError $frontendErr -WindowStyle Hidden -PassThru
            $frontendDeadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $frontendDeadline) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:9847/" -TimeoutSec 3
                if ($response.StatusCode -lt 500) {
                  $frontendReady = $true
                  break
                }
              } catch {
                $frontend.Refresh()
                if ($frontend.HasExited) { break }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $frontendReady) {
              Write-Diagnostics "frontend readiness failure" $frontend $frontendOut $frontendErr
              throw "Frontend readiness failed before the release E2E deadline."
            }

            & $python -m pytest app/tests/e2e -q
            if ($LASTEXITCODE -ne 0) {
              throw "Full release browser E2E suite failed with exit code $LASTEXITCODE"
            }
          } finally {
            if (-not $backendReady -or -not $frontendReady) {
              Write-Diagnostics "release E2E cleanup" $backend $backendOut $backendErr
              Write-Diagnostics "release E2E cleanup" $frontend $frontendOut $frontendErr
            }
            foreach ($process in @($backend, $frontend)) {
              if ($null -ne $process -and -not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

  release-persistence-preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diligent_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d diligent_release_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          echo "$GITHUB_WORKSPACE/app/server/.venv/bin" >> "$GITHUB_PATH"

      - name: Run SQLite and PostgreSQL persistence gates
        working-directory: app/server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/diligent_release_test
        run: python -m pytest ../tests/persistence -q

  release-live-provider-e2e:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DATABASE_BACKEND: sqlite
      EMBEDDED_DATABASE: 'true'
      APP_TEST_BACKEND_URL: http://127.0.0.1:7690
      APP_TEST_FRONTEND_URL: http://127.0.0.1:9847
      FASTAPI_HOST: 127.0.0.1
      FASTAPI_PORT: '7690'
      UI_HOST: 127.0.0.1
      UI_PORT: '9847'
      DILIGENT_LIVE_PROVIDER_E2E: '1'
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Verify provider secret is present
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENCODE_GO_API_KEY)) {
            throw 'OPENCODE_GO_API_KEY is required for the release live-provider E2E gate.'
          }

      - name: Install backend test dependencies
        working-directory: app/server
        run: |
          uv sync --locked --all-extras
          "${env:GITHUB_WORKSPACE}\app\server\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        working-directory: app/client
        run: npm run build -- --progress=false

      - name: Install Playwright browser
        working-directory: app/server
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run release live-provider browser E2E
        shell: pwsh
        env:
          DATABASE_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\release-live-provider.sqlite3
          DILIGENT_SQLITE_PATH: ${{ github.workspace }}\runtimes\cache\pytest\release-live-provider.sqlite3
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\runtimes\cache\playwright
        run: .\app\tests\ci\run_browser_e2e.ps1 -Suite LiveProvider

      - name: Upload provider E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-provider-e2e-logs-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: runtimes/cache/pytest/browser-e2e-logs/**

  release-security-preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'

      - name: Export locked Python dependencies
        working-directory: app/server
        run: uv export --locked --all-extras --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/diligent-requirements.txt"

      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --strict --requirement "$RUNNER_TEMP/diligent-requirements.txt"

      - name: Audit Angular dependencies
        working-directory: app/client
        run: npm audit --audit-level=high --package-lock-only

      - name: Audit desktop dependencies
        working-directory: app/desktop
        run: npm audit --audit-level=high --package-lock-only

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-26
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        # Audit the shipped Windows graph; glib is Linux-only in this lock and
        # is intentionally excluded from the target-specific unsoundness gate.
        run: cargo audit --file app/desktop/src-tauri/Cargo.lock --target-os windows --target-arch x86_64 --deny unsound --ignore RUSTSEC-2024-0429

  package-and-publish:
    permissions:
      contents: write
    needs: [release-preflight, release-persistence-preflight, release-live-provider-e2e, release-security-preflight]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-26
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Build Windows desktop artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $env:RELEASE_TAG"
          }
          $version = $Matches.version
          & .\start_on_windows.ps1 -Action BuildDesktopRelease -Version $version -DesktopTarget All
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop release build failed with exit code $LASTEXITCODE"
          }

      - name: Sign Windows desktop artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_CERT_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_CERT_THUMBPRINT }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($required in @(
            "WINDOWS_CODESIGN_PFX_BASE64",
            "WINDOWS_CODESIGN_PFX_PASSWORD",
            "WINDOWS_CODESIGN_CERT_THUMBPRINT",
            "WINDOWS_CODESIGN_TIMESTAMP_URL"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($required))) {
              throw "Missing required Windows signing material: $required"
            }
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $artifacts = @(
            (Join-Path "release" "DILIGENT-v$version-windows-x64-portable.exe"),
            (Join-Path "release" "DILIGENT-v$version-windows-x64.msi")
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Cannot sign missing release artifact: $artifact"
            }
          }

          $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($null -eq $signtoolCommand) {
            $signtoolCommand = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($null -eq $signtoolCommand) {
            throw "Windows SDK signtool.exe was not found; refusing to publish unsigned artifacts."
          }
          $signtool = if ($signtoolCommand.PSObject.Properties.Name -contains "Source") {
            $signtoolCommand.Source
          } else {
            $signtoolCommand.FullName
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "diligent-release-signing.pfx"
          try {
            try {
              [IO.File]::WriteAllBytes(
                $pfxPath,
                [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64)
              )
            } catch {
              throw "WINDOWS_CODESIGN_PFX_BASE64 is not valid base64: $($_.Exception.Message)"
            }
            if ((Get-Item -LiteralPath $pfxPath).Length -le 0) {
              throw "Decoded Windows signing PFX is empty."
            }

            foreach ($artifact in $artifacts) {
              & $signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL /f $pfxPath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD $artifact
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode signing failed for $artifact with exit code $LASTEXITCODE"
              }
            }

            $expectedThumbprint = ($env:WINDOWS_CODESIGN_CERT_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            foreach ($artifact in $artifacts) {
              $signature = Get-AuthenticodeSignature -LiteralPath $artifact
              if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) {
                throw "Authenticode validation failed for ${artifact}: status=$($signature.Status)"
              }
              $actualThumbprint = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
              if ($actualThumbprint -ne $expectedThumbprint) {
                throw "Unexpected Authenticode signer for ${artifact}: $actualThumbprint != $expectedThumbprint"
              }
              if ($signature.SignerCertificate.NotAfter -lt (Get-Date)) {
                throw "Authenticode signer certificate is expired for $artifact."
              }
              & $signtool verify /pa /all /tw $artifact
              if ($LASTEXITCODE -ne 0) {
                throw "signtool verification failed for $artifact with exit code $LASTEXITCODE"
              }
              Write-Output "Signed and verified: $(Split-Path -Leaf $artifact) ($actualThumbprint)"
            }
          } finally {
            if (Test-Path -LiteralPath $pfxPath -PathType Leaf) {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Regenerate signed artifact checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)
          $artifacts = @(
            (Join-Path "release" "DILIGENT-v$version-windows-x64-portable.exe"),
            (Join-Path "release" "DILIGENT-v$version-windows-x64.msi")
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Cannot checksum missing signed release artifact: $artifact"
            }
          }
          $manifest = Join-Path "release" "DILIGENT-v$version-windows-x64.sha256"
          $lines = foreach ($artifact in $artifacts) {
            $name = Split-Path -Leaf $artifact
            "SHA256  $name"
            "$((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          Set-Content -LiteralPath $manifest -Value $lines -Encoding ascii
          $manifestText = Get-Content -LiteralPath $manifest -Raw
          foreach ($artifact in $artifacts) {
            $name = Split-Path -Leaf $artifact
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($manifestText -notmatch [regex]::Escape("$hash  $name")) {
              throw "Regenerated checksum manifest does not match $name"
            }
          }
          Write-Output "Signed artifact checksum manifest regenerated and verified: $manifest"

      - name: Verify release version contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)
          $jsonPaths = @("app/client/package.json", "app/desktop/package.json")
          foreach ($path in $jsonPaths) {
            $actual = (Get-Content -LiteralPath $path -Raw | ConvertFrom-Json).version
            if ($actual -ne $version) { throw "Version mismatch in ${path}: $actual != $version" }
          }
          $lockJsonPaths = @("app/client/package-lock.json", "app/desktop/package-lock.json")
          foreach ($path in $lockJsonPaths) {
            $lockJson = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
            $rootPackage = $lockJson['packages']['']
            if ($null -eq $rootPackage -or $rootPackage['version'] -ne $version) {
              throw "Lockfile root version mismatch in ${path}: $($rootPackage['version']) != $version"
            }
          }
          $textChecks = @(
            @("app/server/pyproject.toml", '(?m)^version\s*=\s*"([^"]+)"'),
            @("app/desktop/src-tauri/Cargo.toml", '(?m)^version\s*=\s*"([^"]+)"'),
            @("app/desktop/src-tauri/tauri.conf.json", '"version"\s*:\s*"([^"]+)"'),
            @("app/shared/openapi.json", '"version"\s*:\s*"([^"]+)"')
          )
          foreach ($check in $textChecks) {
            $match = [regex]::Match((Get-Content -LiteralPath $check[0] -Raw), $check[1])
            if (-not $match.Success -or $match.Groups[1].Value -ne $version) { throw "Version mismatch in $($check[0])" }
          }
          $lockMatch = [regex]::Match((Get-Content -LiteralPath "app/server/uv.lock" -Raw), '(?ms)\[\[package\]\]\s*name = "diligent"\s*version = "([^"]+)"')
          if (-not $lockMatch.Success -or $lockMatch.Groups[1].Value -ne $version) { throw "uv.lock does not match $version" }
          $cargoLockMatch = [regex]::Match((Get-Content -LiteralPath "app/desktop/src-tauri/Cargo.lock" -Raw), '(?ms)\[\[package\]\]\s*name = "diligent-desktop"\s*version = "([^"]+)"')
          if (-not $cargoLockMatch.Success -or $cargoLockMatch.Groups[1].Value -ne $version) { throw "Cargo.lock does not match $version" }
          Write-Output "Release version contract verified: $version"

      - name: Verify release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)
          $artifacts = @(
            (Join-Path "release" "DILIGENT-v$version-windows-x64-portable.exe"),
            (Join-Path "release" "DILIGENT-v$version-windows-x64.msi"),
            (Join-Path "release" "DILIGENT-v$version-windows-x64.sha256")
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Missing release artifact: $artifact"
            }
            $item = Get-Item -LiteralPath $artifact
            if ($item.Length -le 0) {
              throw "Empty release artifact: $artifact"
            }
            Write-Output "$($item.Name): $($item.Length) bytes"
          }
          $checksumText = Get-Content -LiteralPath $artifacts[2] -Raw
          foreach ($artifact in $artifacts[0..1]) {
            $name = Split-Path -Leaf $artifact
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checksumText -notmatch [regex]::Escape("$hash  $name")) {
              throw "Checksum manifest does not match $name"
            }
          }

      - name: Smoke test Windows EXE and MSI
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          .\app\desktop\build\smoke_release.ps1 -Version $version -DesktopTarget All -InstallMsi

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --generate-notes --title "DILIGENT Clinical Copilot $tag"
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE"
            }
          }
          $artifacts = @(
            (Join-Path "release" "DILIGENT-v$version-windows-x64-portable.exe"),
            (Join-Path "release" "DILIGENT-v$version-windows-x64.msi"),
            (Join-Path "release" "DILIGENT-v$version-windows-x64.sha256")
          )
          $existingNames = @(gh release view $tag --repo $repo --json assets --jq '.assets[].name')
          $downloadDir = Join-Path $env:RUNNER_TEMP "diligent-release-existing"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          foreach ($artifact in $artifacts) {
            $name = Split-Path -Leaf $artifact
            if ($existingNames -contains $name) {
              gh release download $tag --repo $repo --pattern $name --dir $downloadDir --clobber
              if ($LASTEXITCODE -ne 0) { throw "Could not download existing release asset $name" }
              $existing = Join-Path $downloadDir $name
              $localHash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
              $existingHash = (Get-FileHash -LiteralPath $existing -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($localHash -ne $existingHash) { throw "Refusing to overwrite non-identical release asset $name" }
              Write-Output "Existing release asset is byte-identical: $name"
              continue
            }
            gh release upload $tag --repo $repo $artifact
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed for $name" }
          }
