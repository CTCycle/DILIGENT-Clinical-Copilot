name: Desktop Release

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup show active-toolchain

      - name: Install uv
        shell: pwsh
        run: python -m pip install uv

      - name: Seed portable runtimes for Tauri packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "runtimes/python", "runtimes/nodejs", "runtimes/uv" | Out-Null

          $pythonExe = (Get-Command python).Source
          $pythonDir = Split-Path -Parent $pythonExe
          Copy-Item -Path (Join-Path $pythonDir "*") -Destination "runtimes/python" -Recurse -Force

          $nodeExe = (Get-Command node).Source
          $nodeDir = Split-Path -Parent $nodeExe
          Copy-Item -Path (Join-Path $nodeDir "*") -Destination "runtimes/nodejs" -Recurse -Force

          $uvScriptsDir = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $uvExe = Join-Path $uvScriptsDir "uv.exe"
          if (-not (Test-Path $uvExe)) {
            throw "uv.exe not found at $uvExe"
          }
          Copy-Item -Path $uvExe -Destination "runtimes/uv/uv.exe" -Force

      - name: Build Windows desktop artifacts
        shell: cmd
        run: release\tauri\build_with_tauri.bat

      - name: Upload Windows desktop artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          if-no-files-found: error
          path: release/windows/**

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*
