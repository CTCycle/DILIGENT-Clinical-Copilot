<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DILIGENT Clinical Copilot</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { align-items: center; background: #f6f8fb; color: #183047; display: flex; height: 100vh; justify-content: center; margin: 0; }
      main { text-align: center; }
      .mark { color: #0c7c86; font-size: 2.5rem; font-weight: 700; letter-spacing: .08em; }
      p { color: #5d6f7f; }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="mark">DILIGENT</div>
      <p id="desktop-status">Starting Clinical Copilot…</p>
    </main>
    <script>
      window.showStartupError = function (message) {
        const status = document.getElementById('desktop-status');
        if (status) {
          status.textContent = message;
        }
      };
    </script>
  </body>
</html>
