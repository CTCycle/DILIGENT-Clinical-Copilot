[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "DILIGENT"
version = "3.0.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]>=0.40.0",
    "anyio==4.9.0",
    "pandas==3.0.3",
    "tqdm==4.67.3",
    "SQLAlchemy==2.0.50",
    "psycopg[binary]==3.3.4",
    "httpx==0.28.1",
    "trio>=0.30.0",
    "python-dotenv==1.2.2",
    "cryptography==46.0.3",
    "pdfminer.six==20250506",
    "pypdf==6.12.2",    
    "openai==2.38.0",
    "anthropic==0.84.0",
    "google-genai==1.53.0",
    "lancedb==0.30.2",
    "numpy==2.5.1",
    "onnxruntime==1.27.0",
    "tokenizers==0.23.1",
    "huggingface-hub>=0.36.0",
    "openpyxl==3.1.5",    
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.14.2",
    "pyright>=1.1.407",
    "playwright>=1.55.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "api",
    "common",
    "configurations",
    "domain",
    "repositories",
    "services",
]

[tool.ruff]
exclude = [
    "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["../tests/unit"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = [
    "arg-type",
    "assignment",
    "misc",
    "name-defined",
    "no-redef",
    "operator",
    "return-value",
    "return",
    "union-attr",
    "var-annotated",
    "dict-item",
]




