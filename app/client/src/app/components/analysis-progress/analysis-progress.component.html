<section class="analysis-progress" [attr.data-tone]="tone()" aria-label="Analysis progress">
  <div class="analysis-progress-heading">
    <strong>{{ phaseLabel() }}</strong>
    <span class="analysis-progress-meta">
      @if (stepLabel(); as step) {
        <span class="analysis-progress-step" title="Pipeline phase">{{ step }}</span>
      }
      @if (elapsed(); as elapsedLabel) {
        <span class="analysis-progress-elapsed">{{ elapsedLabel }}</span>
      }
    </span>
  </div>
  <div
    class="analysis-progress-track"
    role="progressbar"
    aria-label="Analysis progress"
    [attr.aria-valuemin]="isIndeterminate() ? null : 0"
    [attr.aria-valuemax]="isIndeterminate() ? null : 100"
    [attr.aria-valuenow]="isIndeterminate() ? null : barValue()"
    [attr.aria-valuetext]="phaseLabel()"
  >
    <div
      class="analysis-progress-fill"
      [class.is-indeterminate]="isIndeterminate()"
      [style.width.%]="isIndeterminate() ? null : barValue()"
    ></div>
  </div>
  <p class="analysis-progress-sr" aria-live="polite">{{ phaseLabel() }}</p>
  @if (detail(); as message) {
    <p class="analysis-progress-detail">{{ message }}</p>
  }
  @if (stalled()) {
    <p class="analysis-progress-detail">This step is taking longer than expected; the analysis is still running.</p>
  }
</section>
