<section class="model-config-cloud-options">
  <h2>Cloud Provider Keys</h2>
  @for (provider of providers(); track provider.provider) {
    <div class="model-config-cloud-row" [class.is-active]="selectedProvider() === provider.provider">
      <div class="model-config-provider-name">
        <span class="model-config-provider-mark" [class.is-openai]="provider.provider === 'openai'" [class.is-gemini]="provider.provider === 'gemini'" [class.is-monochrome]="provider.provider === 'openai' || provider.provider === 'anthropic' || provider.provider === 'opencode'">
          @if (provider.logo; as logo) {
            <img class="model-config-provider-logo" [src]="logo.src" [alt]="logo.alt" />
          } @else {
            <span aria-hidden="true">{{ provider.label.slice(0, 1) }}</span>
          }
        </span>
        <span>
          <strong>{{ provider.label }}</strong>
          <small>{{ provider.description }}</small>
        </span>
      </div>
      <button type="button" class="model-config-test-btn" (click)="openKeys(provider.provider)" [disabled]="disabled()">
        Manage keys
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.25" />
          <path d="m8.4 12.2 2.35 2.35 4.85-5.1" />
        </svg>
      </button>
    </div>
  }
</section>

<app-access-key-modal
  [isOpen]="openProvider() !== null"
  [provider]="openProvider() || 'openai'"
  [providerLabel]="modalProviderLabel()"
  (closed)="closeKeys()"
  (keysChanged)="keysChanged.emit()"
></app-access-key-modal>
