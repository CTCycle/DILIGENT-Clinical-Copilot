<main class="page-container stitch-dili-page">
  <div class="stitch-dili-grid">
    <section class="stitch-dili-main stitch-dili-workbench">
      <div class="stitch-dili-input-grid">
        <div class="stitch-dili-input-group stitch-dili-input-group--wide">
          <textarea
            id="clinical-input"
            data-guidance-target="dili-clinical-input"
            aria-label="Clinical Input"
            class="stitch-dili-input-unified"
            maxlength="100000"
            [placeholder]="clinicalInputTemplate()"
            [ngModel]="vm.form.clinicalInput"
            (ngModelChange)="handleFormChange('clinicalInput', $event)"
          ></textarea>
        </div>
      </div>
    </section>

    <aside class="stitch-dili-sidebar">
      <section class="stitch-dili-patient">
        <div class="stitch-dili-patient-top">
          <button
            type="button"
            class="stitch-dili-avatar stitch-dili-avatar-button"
            (click)="openPatientImagePicker()"
            aria-label="Upload patient profile image"
            title="Upload patient profile image"
          >
            @if (patientImageDataUrl) {
              <img [src]="patientImageDataUrl" alt="Patient profile preview" class="stitch-dili-avatar-image" />
            } @else {
              <span aria-hidden="true">{{ patientNameLabel.charAt(0).toUpperCase() }}</span>
            }
          </button>
          <input
            #patientImageInput
            type="file"
            accept="image/*"
            class="inspection-folder-input"
            aria-label="Patient profile image file picker"
            (change)="handlePatientImageSelection($event)"
          />
          <h3>{{ patientNameLabel }}</h3>
        </div>

        <div class="stitch-dili-inline-fields" data-guidance-target="dili-patient-details">
          <div class="field">
            <label class="field-label" for="patient-name">Patient Name</label>
            <input
              id="patient-name"
              type="text"
              maxlength="200"
              placeholder="e.g., Marco Rossi"
              [ngModel]="vm.form.patientName"
              (ngModelChange)="handleFormChange('patientName', $event)"
            />
          </div>
          <div class="field">
            <label class="field-label" for="visit-date">Visit Date</label>
            <input
              id="visit-date"
              type="date"
              lang="en-GB"
              [max]="todayIso"
              [ngModel]="vm.form.visitDate"
              (ngModelChange)="handleVisitDateChange($event)"
            />
          </div>
        </div>

        <div class="stitch-dili-actions">
          <button
            id="run-analysis-button"
            data-guidance-target="dili-review-run"
            class="btn btn-primary"
            type="button"
            [disabled]="loadingDraft()"
            (click)="runAnalysis()"
          >
            Run DILI analysis
          </button>
          <button
            id="save-draft-button"
            class="btn btn-secondary"
            type="button"
            [disabled]="loadingDraft() || vm.saveStatus === 'saving'"
            (click)="saveDraft()"
          >
            Save as draft
          </button>
          <button class="stitch-dili-clear" type="button" (click)="clearAll()">
            Clear all
          </button>
        </div>

        <section class="dili-draft-panel" aria-label="Draft status">
          <div class="dili-draft-status-row">
            <p
              class="dili-draft-status"
              [class.is-error]="vm.saveStatus === 'error' || vm.saveStatus === 'conflict'"
              role="status"
              aria-live="polite"
            >
              {{ draftStatusText }}
            </p>
            @if (vm.saveStatus === 'conflict' && vm.draftSessionId !== null) {
              <button class="dili-draft-link" type="button" (click)="reloadDraft()">Reload draft</button>
            }
          </div>
          @if (pageError(); as error) {
            <p class="dili-draft-status is-error" role="alert">{{ error }}</p>
          }
        </section>

        @if (!vm.form.clinicalInput && vm.draftSessionId === null) {
          <app-feature-tip
            [guidanceId]="'dili-first-assessment'"
            [version]="guidanceDefinitions.diliFirstAssessment.version"
            [title]="guidanceDefinitions.diliFirstAssessment.title"
            [body]="guidanceDefinitions.diliFirstAssessment.description"
            actionLabel="Show me"
            secondaryLabel="Open Agent Studio"
            (primaryAction)="startAssessmentTour()"
            (secondaryAction)="openConfigurations()"
          ></app-feature-tip>
        }
      </section>

    </aside>
  </div>

</main>

<app-analysis-wizard
  [isOpen]="wizardOpen()"
  (cancelled)="closeWizard()"
  (started)="closeWizard()"
  (fixInput)="fixInput($event)"
  (editSource)="editSource($event)"
></app-analysis-wizard>
