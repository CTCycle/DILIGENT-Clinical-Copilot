<section class="subsection" aria-labelledby="rev-instructions-heading">
  <h3 id="rev-instructions-heading">Custom instructions</h3>
  <p class="agent-section-note">
    Optional. Supplements the standard report review: how to conduct it, what to prioritise, and any
    terminology, tone or formatting preferences. It cannot override clinical safety rules or the
    constraints on what a revision may change.
  </p>
  <label class="field">
    <span class="visually-hidden">Custom instructions</span>
    <textarea rows="4" [value]="config().instructions.custom_instructions"
      (input)="setInstructions($any($event.target).value)"></textarea>
    <span class="field-counter" [class.is-over]="config().instructions.custom_instructions.length > limit">
      {{ config().instructions.custom_instructions.length }} / {{ limit }}
    </span>
  </label>
</section>

<app-agent-models-section heading="Model" headingId="rev-models-heading" [disabled]="disabled()"
  [refs]="[config().models.planning]">
  <app-agent-model-field label="Review model" [ref]="config().models.planning"
    [providerOptions]="providerOptions()" [catalog]="catalog()" (refChange)="setModel($event)" />
  <p class="field-hint">Used for every stage of the review pipeline.</p>
</app-agent-models-section>
</fieldset>
