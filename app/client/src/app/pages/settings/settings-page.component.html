<main class="page-container settings-page">
  <aside class="settings-navigation" aria-label="Settings sections">
    <div class="settings-navigation-heading">
      <h1>Settings</h1>
    </div>

    <nav class="settings-navigation-list">
      @for (item of navItems; track item.path) {
        <a
          class="settings-navigation-link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [ariaCurrentWhenActive]="'page'"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <p class="settings-environment-note">
      Process and deployment settings are managed at launch; database connections can be changed here.
    </p>
  </aside>

  <section class="settings-content" aria-label="Selected settings section">
    <router-outlet></router-outlet>
  </section>
</main>
